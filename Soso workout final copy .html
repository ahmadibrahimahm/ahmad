<title>Sarah's Workout 💕</title>

<!-- Install banner shown once on first open -->
<style>
  #install-banner {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 9999; background: #FF6FA6; color: #fff;
    padding: 12px 20px; border-radius: 18px;
    font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600;
    text-align: center; box-shadow: 0 6px 30px #FF6FA660;
    max-width: 290px; width: calc(100% - 40px);
    animation: slideUp 0.4s ease;
    display: none;
  }
  #install-banner.show { display: block; }
  #install-banner .arrow { font-size: 20px; display: block; margin-bottom: 2px; }
  #install-banner .close-btn {
    position: absolute; top: 6px; right: 10px;
    background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; padding: 0;
  }
  @keyframes slideUp { from { opacity:0; transform: translateX(-50%) translateY(20px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
</style>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --pink: #FF6FA6;
    --pink-light: #FFB3CC;
    --pink-pale: #FFF0F5;
    --pink-dark: #E91E8C;
    --rose: #FF4D8F;
  }

  body {
    background: #1a0a10;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    color: #fff0f5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Floating photo background */
  .bg-photos {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-photo {
    position: absolute;
    border-radius: 20px;
    opacity: 0.55;
    object-fit: cover;
    filter: saturate(0.85) sepia(0.15) brightness(0.9);
    box-shadow: 0 8px 40px #00000060;
  }
  .bg-photo:nth-child(1) {
    width: 320px; height: 420px;
    top: -20px; left: -40px;
    transform: rotate(-7deg);
  }
  .bg-photo:nth-child(2) {
    width: 260px; height: 200px;
    top: 28%; right: -30px;
    transform: rotate(5deg);
  }
  .bg-photo:nth-child(3) {
    width: 240px; height: 360px;
    bottom: 8%; left: 2%;
    transform: rotate(-4deg);
  }
  .bg-photo:nth-child(4) {
    width: 210px; height: 420px;
    bottom: -20px; right: -10px;
    transform: rotate(9deg);
  }

  /* Pink overlay gradient */
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 0%, #FF6FA610 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 100%, #E91E8C10 0%, transparent 60%),
      linear-gradient(180deg, #1a0a1060 0%, #1a0a1035 50%, #1a0a1060 100%);
    pointer-events: none;
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, #1a0a10f5 0%, #1a0a10ee 100%);
    border-bottom: 1px solid #FF6FA630;
    padding: 22px 20px 16px;
    backdrop-filter: blur(12px);
  }
  .header-heart {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--pink);
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    margin-bottom: 4px;
  }
  .header h1 {
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .header h1 span { color: var(--pink); }

  .tabs {
    display: flex;
    gap: 5px;
    margin-top: 14px;
    background: #2a0d18;
    padding: 5px;
    border-radius: 14px;
    border: 1px solid #FF6FA620;
  }
  .day-tab {
    flex: 1;
    padding: 9px 4px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 10px;
    transition: all 0.25s ease;
    text-align: center;
    color: #a06070;
  }
  .day-tab:hover { background: #3a1020; }
  .day-tab.active { background: var(--pink); color: #fff !important; }
  .tab-emoji { font-size: 16px; }
  .tab-label { font-size: 10px; font-weight: 700; margin-top: 2px; font-family: -apple-system, 'SF Pro Display', sans-serif; }

  .content {
    position: relative;
    z-index: 10;
    padding: 20px 16px 60px;
    max-width: 520px;
    margin: 0 auto;
  }

  .fade-in { animation: fadeIn 0.35s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-hero {
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #FF6FA640;
    background: linear-gradient(135deg, #FF6FA615, #E91E8C08);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-label-text { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; margin-bottom: 4px; color: var(--pink); }
  .day-title { font-family: -apple-system, 'SF Pro Display', sans-serif; font-size: 22px; font-weight: 800; color: #fff; }
  .badges { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .hero-emoji { font-size: 48px; }

  /* Love letter card */
  .love-note {
    background: linear-gradient(135deg, #FF6FA618, #E91E8C12);
    border: 1px solid #FF6FA650;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .love-icon { font-size: 22px; flex-shrink: 0; }
  .love-text {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 14px;
    color: var(--pink-light);
    line-height: 1.5;
  }

  .info-box {
    background: #1e0a12;
    border: 1px solid #2e1a22;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .info-icon { font-size: 18px; flex-shrink: 0; }
  .info-label { font-size: 11px; color: #7a4a58; letter-spacing: 0.1em; margin-bottom: 3px; }
  .info-text { font-size: 13px; color: #c090a0; line-height: 1.5; }

  .section-label { font-size: 11px; letter-spacing: 0.15em; color: #7a4a58; margin: 16px 0 10px; font-weight: 700; }

  .exercises { display: flex; flex-direction: column; gap: 7px; }
  .exercise-row {
    background: #1e0a12;
    border-radius: 12px;
    padding: 13px 16px;
    border: 1px solid #2e1a22;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .exercise-row:hover { background: #280d17; border-color: #FF6FA640; }
  .ex-top { display: flex; justify-content: space-between; align-items: center; }
  .ex-left { display: flex; gap: 10px; align-items: center; }
  .ex-num {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    flex-shrink: 0;
    font-family: -apple-system, 'SF Pro Display', sans-serif;
    background: #FF6FA622;
    color: var(--pink);
  }
  .ex-name { font-size: 14px; font-weight: 500; color: #ffe0ec; }
  .ex-right { display: flex; gap: 8px; align-items: center; }
  .ex-sets { font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: #2a0d18; color: #a06070; }
  .ex-arrow { color: #7a4a58; font-size: 12px; }
  .ex-note {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #2e1a22;
    font-size: 12px; color: #c090a0;
    display: none; gap: 6px; align-items: flex-start;
  }
  .ex-note.open { display: flex; }
  .ex-note-heart { color: var(--pink); font-size: 14px; flex-shrink: 0; }

  .schedule-box {
    margin-top: 20px;
    padding: 14px 16px;
    background: #1e0a12;
    border: 1px solid #2e1a22;
    border-radius: 12px;
  }
  .schedule-label { font-size: 11px; color: #7a4a58; letter-spacing: 0.12em; margin-bottom: 8px; }
  .schedule-days { display: flex; gap: 4px; flex-wrap: wrap; }
  .sched-day {
    flex: 1; min-width: 36px;
    padding: 8px 4px;
    border-radius: 8px;
    text-align: center;
  }
  .sched-day-name { font-size: 9px; margin-bottom: 2px; color: #a06070; }
  .sched-day-emoji { font-size: 13px; }

  /* Floating hearts */
  .floating-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .fheart {
    position: absolute;
    font-size: 14px;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    10% { opacity: 0.6; }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.2); }
  }
</style>
</head>
<body>
<style>
#lock-screen {
  position: fixed;
  inset: 0;
  background: #1a0a10;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
}
#lock-screen .lock-emoji { font-size: 52px; margin-bottom: 16px; }
#lock-screen h2 {
  font-family: -apple-system, sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
#lock-screen p {
  font-family: -apple-system, sans-serif;
  font-size: 14px;
  color: #a06070;
  margin-bottom: 28px;
}
#lock-input {
  width: 100%;
  max-width: 280px;
  padding: 14px 18px;
  border-radius: 14px;
  border: 1.5px solid #FF6FA650;
  background: #220b15;
  color: #fff;
  font-size: 16px;
  font-family: -apple-system, sans-serif;
  text-align: center;
  outline: none;
  margin-bottom: 14px;
  letter-spacing: 0.1em;
}
#lock-input:focus { border-color: #FF6FA6; }
#lock-btn {
  width: 100%;
  max-width: 280px;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: #FF6FA6;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: -apple-system, sans-serif;
  cursor: pointer;
}
#lock-error {
  margin-top: 14px;
  font-size: 13px;
  color: #FF4D8F;
  font-family: -apple-system, sans-serif;
  display: none;
}
</style>

<div id="lock-screen">
  <div class="lock-emoji">🔒</div>
  <h2>Sarah's Workout 💕</h2>
  <p>Enter the password to continue</p>
  <input id="lock-input" type="password" placeholder="password" />
  <button id="lock-btn" onclick="checkPassword()">Unlock 💗</button>
  <p id="lock-error">Wrong password, try again 🥺</p>
</div>

<script>
document.getElementById('lock-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});
function checkPassword() {
  var val = document.getElementById('lock-input').value;
  if (val === 'ilovebbo') {
    document.getElementById('lock-screen').style.display = 'none';
  } else {
    document.getElementById('lock-error').style.display = 'block';
    document.getElementById('lock-input').value = '';
  }
}
</script>

    h.textContent = ['💕','💗','💖','💓','🌸','🌹','✨','💘'][Math.floor(Math.random()*8)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.bottom = '-20px';
    h.style.animationDuration = (6 + Math.random()*8) + 's';
    h.style.animationDelay = (Math.random()*2) + 's';
    h.style.fontSize = (10 + Math.random()*16) + 'px';
    container.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }, 900);
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = days.map((d, i) => `
    <button class="day-tab ${i === activeDay ? 'active' : ''}"
      onclick="switchDay(${i})">
      <div class="tab-emoji">${d.emoji}</div>
      <div class="tab-label">${d.label}</div>
    </button>
  `).join('');
}

function renderContent() {
  const d = days[activeDay];
  const iColor = intensityColor[d.intensity];
  expandedEx = null;

  const scheduleHTML = weekDays.map(day => {
    const idx = scheduleMap[day];
    const isActive = idx !== undefined;
    return `<div class="sched-day" style="background:${isActive ? '#FF6FA620' : '#200a12'};border:1px solid ${isActive ? '#FF6FA650' : '#2e1a22'}">
      <div class="sched-day-name">${day}</div>
      <div class="sched-day-emoji">${isActive ? days[idx].emoji : '—'}</div>
    </div>`;
  }).join('');

  const exercisesHTML = d.exercises.map((ex, i) => `
    <div class="exercise-row" id="ex-${i}" onclick="toggleEx(${i})">
      <div class="ex-top">
        <div class="ex-left">
          <span class="ex-num">${i+1}</span>
          <span class="ex-name">${ex.name}</span>
        </div>
        <div class="ex-right">
          <span class="ex-sets">${ex.sets} × ${ex.reps}</span>
          <span class="ex-arrow" id="arrow-${i}">▼</span>
        </div>
      </div>
      <div class="ex-note" id="note-${i}">
        <span class="ex-note-heart">💕</span>
        <span>${ex.note}</span>
      </div>
    </div>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div class="fade-in">
      <div class="day-hero">
        <div>
          <p class="day-label-text">${d.label}</p>
          <h2 class="day-title" style="font-family:-apple-system,sans-serif">${d.type}</h2>
          <div class="badges">
            <span class="badge" style="background:#200a12;color:#a06070">⏱ ${d.duration}</span>
            <span class="badge" style="background:${iColor}30;color:${iColor}">${d.intensity}</span>
          </div>
        </div>
        <div class="hero-emoji">${d.emoji}</div>
      </div>

      <div class="love-note">
        <span class="love-icon">💌</span>
        <p class="love-text">${d.loveNote}</p>
      </div>

      <div class="info-box">
        <span class="info-icon">🔆</span>
        <div>
          <p class="info-label">WARM-UP</p>
          <p class="info-text">${d.warmup}</p>
        </div>
      </div>

      <p class="section-label">EXERCISES · ${d.exercises.length} MOVEMENTS 💗</p>
      <div class="exercises">${exercisesHTML}</div>

      <div class="info-box" style="margin-top:12px">
        <span class="info-icon">🌙</span>
        <div>
          <p class="info-label">COOL-DOWN</p>
          <p class="info-text">${d.cooldown}</p>
        </div>
      </div>

      <div class="schedule-box">
        <p class="schedule-label">SUGGESTED WEEKLY SCHEDULE 🌸</p>
        <div class="schedule-days">${scheduleHTML}</div>
      </div>
    </div>
  `;
}

function switchDay(i) {
  activeDay = i;
  renderTabs();
  renderContent();
}

function toggleEx(i) {
  const note = document.getElementById(`note-${i}`);
  const arrow = document.getElementById(`arrow-${i}`);
  const row = document.getElementById(`ex-${i}`);

  if (expandedEx === i) {
    note.classList.remove('open');
    arrow.textContent = '▼';
    row.style.borderColor = '#2e1a22';
    expandedEx = null;
  } else {
    if (expandedEx !== null) {
      document.getElementById(`note-${expandedEx}`).classList.remove('open');
      document.getElementById(`arrow-${expandedEx}`).textContent = '▼';
      document.getElementById(`ex-${expandedEx}`).style.borderColor = '#2e1a22';
    }
    note.classList.add('open');
    arrow.textContent = '▲';
    row.style.borderColor = '#FF6FA6';
    expandedEx = i;
  }
}

spawnHearts();
renderTabs();
renderContent();

// Show "Add to Home Screen" banner on first visit in Safari (not already in standalone mode)
(function() {
  const isStandalone = window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dismissed = sessionStorage.getItem('pwa-banner-dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    const banner = document.getElementById('install-banner');
    if (banner) setTimeout(() => banner.classList.add('show'), 1800);
  }
  const closeBtn = document.getElementById('banner-close');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
      sessionStorage.setItem('pwa-banner-dismissed', '1');
    });
  }
})();
</script>

<!-- Add to Home Screen banner (shown once on iOS Safari) -->
<div id="install-banner">
  <button class="close-btn" id="banner-close">✕</button>
  <span class="arrow">⬆️</span>
  Tap <strong>Share</strong> → <strong>"Add to Home Screen"</strong><br>to use this as an app 💕
</div>
